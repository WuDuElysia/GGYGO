
[/Script/CommonUI.CommonUISettings]
CommonButtonAcceptKeyHandling=TriggerClick

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=D4A0DB1F48164C2BBAEEAE84A776F8A2

; 替换 GAS 的全局对象，使所有 EffectContext 都创建为 FGGYGOGameplayEffectContext。
; 缺少这段配置不会报错，但自定义 EffectContext 的扩展字段会静默失效
; （FGGYGOGameplayEffectContext::ExtractEffectContext 将始终返回 nullptr）。
[/Script/GameplayAbilities.AbilitySystemGlobals]
AbilitySystemGlobalsClassName="/Script/GGYGO.GGYGOAbilitySystemGlobals"

; GameplayCue 的加载策略。不配这行会退回引擎默认的启动时全量加载，
; 表现为启动变慢且用不到的特效常驻内存。
GameplayCueManagerClassName="/Script/GGYGO.GGYGOGameplayCueManager"

; Cue 资产的扫描路径。只扫这些目录，避免遍历整个 Content。
; 路径写错不会报错，但所有 Cue 都会找不到而静默不播。
+GameplayCueNotifyPaths="/Game/GameplayCues"

; 项目级共享资产的路径。需要先在编辑器里创建一份 UGGYGOGameData 资产。
; 路径为空或指向不存在的资产时会中止运行，理由同 AssetManagerClassName。
[/Script/GGYGO.GGYGOAssetManager]
GGYGOGameDataPath="/Game/System/GGYGOGameData.GGYGOGameData"

; 让 AssetManager 认识共享资产类型，打包时才会把它包含进去。
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GGYGOGameData",AssetBaseClass="/Script/GGYGO.GGYGOGameData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/System")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; 角色配置注册成 PrimaryAsset，让编队存档能用 FPrimaryAssetId 引用角色。
; CookRule 必须是 AlwaysCook：存档里存的是 Id 而不是资产引用，
; 没有任何硬引用链会把这些资产带进包里，漏掉就是打包后编队解析不出角色。
+PrimaryAssetTypesToScan=(PrimaryAssetType="GGYGOPawnData",AssetBaseClass="/Script/GGYGO.GGYGOPawnData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Characters")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
; GameFeature 插件工作的前提。不注册这条时 GameFeatures 子系统在启动阶段直接报
; "Asset manager settings do not include a rule for assets of type GameFeatureData"，
; 插件功能整体不可用。
; Directories 留空是有意的：GameFeatureData 资产在各插件自己的根目录下，
; 由插件系统发现，不需要 AssetManager 去 /Game 里扫。这里只是让它认识这个类型。
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
